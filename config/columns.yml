# ============================================================================
# CONTRATTO COLONNE — sorgente di verita' della mappatura CSV -> workbook.
#
# PROVENIENZA: verificato il 2026-07-31 contro "Omni Report W30.xlsm" leggendo
#   (a) le intestazioni reali di riga 1 dei 4 fogli DATASET,
#   (b) tutte le formule del workbook (quali colonne dataset sono consumate),
#   (c) il codice VBA del modulo CreaMalpractice (decompresso).
# Rigenerabile con:  python tools/audit_workbook.py "samples/Omni Report W30.xlsm"
#
# NON allineare a "Definizioni KPI": e' obsoleto (piano §0).
#
# `role`:
#   input   -> valore preso dal CSV e scritto in `target_col`
#   derived -> calcolato dalle formule del template; la pipeline NON lo scrive
# `match`:
#   exact_first (default) -> nome esatto, poi nome normalizzato, poi alias
#   exact       -> SOLO nome esatto. Da usare quando esiste nel sorgente una
#                  colonna diversa che collassa sullo stesso nome normalizzato:
#                  meglio fallire che legare la formula alla colonna sbagliata.
# `consumers`: chi legge la colonna nel workbook. Serve al test di
#   auto-verifica del contratto: se una formula nuova consuma una colonna che
#   qui non c'e', il test lo segnala.
# ============================================================================

normalize:
  lower: true
  strip: true
  collapse_spaces: true
  underscore_eq_space: true
  strip_punct: ["(", ")", "%", "–", "-", "/", "|", ".", ",", ":"]

datasets:

  # --------------------------------------------------------------------------
  # AT_DATASET — Agent Timeline. ~130k righe.
  # Colonna A = indice di riga (valori 1..N, decorativo: nessuna formula ne'
  # il VBA la leggono). Dati veri da B. P/Q sono formule del template,
  # pre-riempite fino a riga 130000.
  # --------------------------------------------------------------------------
  AT_DATASET:
    sheet: AT_DATASET
    header_row: 1
    data_start_col: B
    data_end_col: N          # oltre N ci sono O (libera) e P/Q derivate
    max_template_row: 130000 # fin dove arrivano le formule P/Q nel template
    fields:
      - canonical: "Agent Email"
        target_col: B
        role: input
        dtype: str
        aliases: ["agent_email", "Agent E-mail"]
        consumers: ["Report Agenti", "Analisi Status", "Verifica AHT", "VBA:AddATRules"]
        notes: "Chiave agente. Il VBA usa questa colonna per trovare l'ultima riga (End(xlUp) su B)."
      - canonical: "Agent State"
        target_col: F
        role: input
        dtype: str
        aliases: ["agent_state", "State"]
        consumers: ["Report Agenti", "Analisi Status", "VBA:AddATRules"]
        notes: "Valori usati: Break, Available Cases, Login, Offline."
      - canonical: "Number of Active Contacts"
        target_col: H
        role: input
        dtype: float
        aliases: ["number_of_active_contacts", "Active Contacts"]
        consumers: ["Verifica AHT"]
        notes: "ASSENTE dal piano §4 — trovata scansionando le formule di 'Verifica AHT'."
      - canonical: "Start Time"
        target_col: I
        role: input
        dtype: datetime
        aliases: ["start_time", "Interval Start"]
        consumers: ["AT_DATASET!P", "AT_DATASET!Q"]
        notes: "Sorgente di P e Q. Nessuna formula esterna la legge direttamente."
      - canonical: "Total Time in seconds"
        target_col: K
        role: input
        dtype: float
        aliases: ["total_time_seconds", "Total Time (s)", "total_time_in_seconds"]
        consumers: ["Report Agenti", "Analisi Status", "Verifica AHT", "VBA:AddATRules"]
      - canonical: "Productive Aux Flag (Yes / No)"
        target_col: L
        role: input
        dtype: str
        aliases: ["productive_aux_flag", "Productive Aux", "Productive Aux Flag"]
        consumers: ["Report Agenti", "Analisi Status", "Verifica AHT"]
        notes: "Valori Yes/No."
      - canonical: "Data Milano"
        target_col: P
        role: derived
        source: "Start Time"
        consumers: ["Report Agenti", "Analisi Status", "VBA:AddATRules"]
        formula: '=IF($I2="","",INT($I2+''Helper Malpractice''!$B$7/24))'
      - canonical: "Ora Milano"
        target_col: Q
        role: derived
        source: "Start Time"
        consumers: ["VBA:AddATRules"]
        formula: '=IF($I2="","",($I2+''Helper Malpractice''!$B$7/24)-INT($I2+''Helper Malpractice''!$B$7/24))'
    # Offset fuso Seattle->Milano, in ore. Vive nel workbook: la pipeline lo
    # legge da qui e non lo duplica in settings.yml.
    derive_offset_from: "'Helper Malpractice'!B7"

  # --------------------------------------------------------------------------
  # ATwi_DATASET — Agent Timeline / workitem. ~15k righe.
  # Colonna A = indice di riga (decorativo). Dati da B.
  # --------------------------------------------------------------------------
  ATwi_DATASET:
    sheet: ATwi_DATASET
    header_row: 1
    data_start_col: B
    data_end_col: P
    fields:
      - canonical: "Agent Email"
        target_col: C
        role: input
        dtype: str
        aliases: ["agent_email", "Agent E-mail"]
        consumers: ["Outbound Exploitation", "Verifica AHT"]
      - canonical: "Talk Time in seconds"
        target_col: H
        role: input
        dtype: float
        aliases: ["talk_time_seconds", "talk_time_in_seconds"]
        consumers: ["Outbound Exploitation"]
      - canonical: "Wrap-up Time in seconds"
        target_col: I
        role: input
        dtype: float
        aliases: ["wrap_up_time_seconds", "ACW seconds", "wrap_up_time_in_seconds", "Wrap up Time in seconds"]
        consumers: ["Outbound Exploitation"]
      - canonical: "Handle Time in seconds"
        target_col: J
        role: input
        dtype: float
        aliases: ["handle_time_seconds", "handle_time_in_seconds"]
        consumers: ["Verifica AHT"]
        notes: "ASSENTE dal piano §4 — trovata scansionando le formule di 'Verifica AHT'."
      - canonical: "Initiation Method"
        target_col: M
        role: input
        dtype: str
        aliases: ["initiation_method"]
        consumers: ["Outbound Exploitation"]
        notes: "Filtro sul valore OUTBOUND. Le soglie stanno sul foglio (C46/C47/C48), non sono input."

  # --------------------------------------------------------------------------
  # SF_DATABASE — export Salesforce, 143 colonne. Dati da A.
  # ATTENZIONE: il foglio ospita la tabella (ListObject) `AHT_Data`. Vedi
  # docs/audit-workbook-W30.md §3: nel file W30 la tabella copre A1:EM3389
  # mentre i dati arrivano a riga 3568 -> il writer DEVE ridimensionarla.
  # --------------------------------------------------------------------------
  SF_DATABASE:
    sheet: SF_DATABASE
    header_row: 1
    data_start_col: A
    data_end_col: EM
    list_object: AHT_Data
    fields:
      - canonical: "Date Viewpoint"
        target_col: A
        role: input
        dtype: datetime
        date_format: "%m/%d/%Y %I:%M:%S %p"
        aliases: ["date_viewpoint"]
        consumers: ["Python:aht_history"]
        notes: >
          Il lunedi' della settimana coperta dall'export: Tableau scarica a
          granularita' settimanale, quindi tutte le righe hanno lo stesso
          valore (nel W33: 8/10/2026 su 2833 righe su 2833).
          Nessuna formula del workbook la legge — la usa Python, per due
          controlli di coerenza: che cada di lunedi' e che sia la stessa
          settimana del resto del report.
          date_format e' OBBLIGATORIO qui e non e' una precauzione teorica:
          `8/10/2026` si legge sia come 10 agosto (export americano, questo)
          sia come 8 ottobre, e la lista di formati provava prima quello
          europeo. Senza questa riga la settimana risultava la 41 invece
          della 33, in silenzio.
      - canonical: "Case Origin (group)"
        target_col: U
        role: input
        dtype: str
        aliases: ["case_origin_group"]
        consumers: ["Report Agenti"]
        notes: "Valori Phone/Other. Esiste anche 'Case Origin' (col. T): normalizzano diverso, nessuna ambiguita'."
      - canonical: "Case Type"
        target_col: Z
        role: input
        dtype: str
        aliases: ["case_type"]
        consumers: ["AHT Outliers"]
        notes: >
          Aggiunta il 2026-08-04, dopo che 'AHT Outliers' e' uscito VUOTO nel
          primo W31 generato: le sue formule raggruppano per tipo di caso
          (LET su AHT_Data[Case Type], MEDIAN/QUARTILE per tipo) e senza questa
          colonna il FILTER non trova nulla.
          Era sfuggita perche' le formule la citano come riferimento
          strutturato — `AHT_Data[Case Type]` — e non come `SF_DATABASE!$Z`:
          l'audit cercava solo la seconda forma. Ora le risolve entrambe.
      - canonical: "case_has_outgoing_email"
        target_col: AC
        role: input
        dtype: str
        aliases: []
        consumers: ["Report Agenti"]
        notes: "True/False. Usata per la % Non-live senza email in uscita."
      - canonical: "case_number"
        target_col: AE
        role: input
        dtype: str
        aliases: ["Case Number", "case_no"]
        consumers: ["VBA:AddSFRules"]
        notes: "Citata nei dettagli di malpractice."
      - canonical: "Employee Name"
        target_col: BB
        role: input
        dtype: str
        aliases: ["employee_name"]
        consumers: ["Report Agenti", "Anagrafica", "VBA:AddSFRules"]
        notes: "Chiave agente. Il VBA la usa per l'ultima riga (End(xlUp) su BB)."
      - canonical: "Primary Category"
        target_col: BV
        role: input
        dtype: str
        aliases: ["primary_category"]
        consumers: ["AHT Outliers"]
        notes: >
          Aggiunta il 2026-08-04 insieme a 'Case Type', stessa causa. Esiste
          anche 'Secondary Category' (CH), che nessuna formula legge: se un
          giorno servisse, va aggiunta qui.
      - canonical: "Case AHT (mins)"
        target_col: DY
        role: input
        dtype: float
        aliases: ["case_aht_mins", "AHT (min)"]
        consumers: ["Report Agenti", "VBA:AddSFRules"]
        notes: >
          Da NON confondere con le altre colonne che contengono 'AHT':
          'AHT due to Misroutes' (DU), 'aht_due_to_misrouted_hours' (DV),
          'Overall Performance to AHT Target' (EJ), 'logged_hrs_incld_in_aht' (EH).
          Nessuna collassa su 'case aht mins', quindi exact_first e' sicuro.
      - canonical: "Co-Browse Usage %"
        target_col: EC
        role: input
        dtype: float
        aliases: ["cobrowse_usage_pct"]
        consumers: ["Report Agenti"]
      - canonical: "Misrouted Cases"
        target_col: EI
        role: input
        dtype: float
        aliases: ["misrouted_cases"]
        consumers: ["Report Agenti"]
      - canonical: "Overall Performance to AHT Target"
        target_col: EJ
        role: input
        dtype: float
        aliases: ["overall_performance_to_aht_target"]
        consumers: ["Helper CaseType"]
        notes: >
          Aggiunta il 2026-08-18 con i fogli 'CaseType Deepdive' /
          'Helper CaseType'. Quest'ultimo la legge come riferimento
          strutturato — AHT_Data[Overall Performance to AHT Target] — per la
          colonna Out_of_Target: COUNTIFS(..., ">=1") / volume, cioe' la quota
          di casi che hanno sforato il target di AHT.
          Senza questa colonna Out_of_Target resta 0 per ogni case type e la
          classificazione (Highly Actionable / Actionable / Process Driven)
          perde uno dei suoi cinque ingredienti, sempre a favore di
          'Process Driven'. Nessun errore visibile: solo un deepdive che dice
          che va tutto bene.

  # --------------------------------------------------------------------------
  # PSAT_DATASET — export survey, 134 colonne (il piano diceva 121: l'export
  # e' cresciuto). Dati da A.
  #
  # optional: true — deciso il 2026-08-10, dopo che per la W32 l'export dei
  # sondaggi non esisteva affatto (nessuna risposta quella settimana, non un
  # errore di chi scarica). Nessun campo qui sotto ha un consumatore `VBA:...`:
  # i suoi soli lettori sono 'Report Agenti' (una colonna), 'Recap PSAT
  # Positive' e 'PSAT Positive Export' — nessuno di questi e' il motore di
  # malpractice. Se il file manca, il preflight SEGNALA (non BLOCCA) e il
  # foglio viene scritto vuoto, cosi' quei tre punti restano vuoti per la
  # settimana invece di mostrare dati di una settimana precedente: il template
  # portava ancora 130 righe residue quando questo e' stato misurato.
  # --------------------------------------------------------------------------
  PSAT_DATASET:
    sheet: PSAT_DATASET
    header_row: 1
    data_start_col: A
    data_end_col: ED
    optional: true
    fields:
      - canonical: "Agent Name"
        target_col: I
        role: input
        dtype: str
        match: exact
        aliases: []
        consumers: ["Report Agenti", "Recap PSAT Positive", "PSAT Positive Export"]
        notes: >
          match=exact obbligatorio: esiste anche 'agent_name' (col. BO), che
          normalizza sulla stessa stringa. Un rename dell'header deve far
          fallire il preflight, non ripiegare silenziosamente su BO.
      - canonical: "Survey Date (Exact)"
        target_col: AU
        role: input
        dtype: datetime
        aliases: ["survey_date_exact"]
        consumers: ["Recap PSAT Positive"]
        notes: >
          ASSENTE dal piano §4 — trovata scansionando le formule di
          'Recap PSAT Positive'. Nel sorgente esistono anche 'Survey Date' (DB)
          e 'Survey Date (Relative)' (AV): normalizzano diverso.
      - canonical: "Case Number"
        target_col: DO
        role: input
        dtype: str
        aliases: ["case_number"]
        consumers: ["Recap PSAT Positive", "PSAT Positive Export"]
      - canonical: "psat_score"
        target_col: DP
        role: input
        dtype: float
        match: exact
        aliases: []
        consumers: ["Report Agenti", "Recap PSAT Positive", "PSAT Positive Export"]
        notes: >
          Valori 0/1. match=exact obbligatorio: esiste anche 'PSAT Score'
          (col. EK) che normalizza sulla stessa stringa ma ha scala diversa.
      - canonical: "response_text"
        target_col: DQ
        role: input
        dtype: str
        aliases: ["comment", "verbatim"]
        consumers: ["Recap PSAT Positive"]
        notes: >
          'Elogio della settimana': alcune celle di 'Recap PSAT Positive'
          puntano alla riga FISSA 130 (DQ130/I130/DO130) = selezione manuale
          del commento migliore. Fuori contratto, vedi piano §14 domanda 3.

  # --------------------------------------------------------------------------
  # DUP_DATASET — report Salesforce "Leo's Orchidea Dup Cases (date interval)",
  # cioe' i casi chiusi come duplicato o spam nella settimana.
  #
  # E' IL PRIMO DATASET CHE NON E' UNA TABELLA PULITA. E' il report formattato
  # cosi' come lo scarica Excel, e quindi porta con se':
  #
  #   righe 1-13   preambolo: titolo, "As of <quando>", il blocco "Filtered By"
  #   riga  14     INTESTAZIONI  (colonne B..Q; C non ha nome)
  #   righe 15..N  i record
  #   righe N+1,2  la coda dei totali: `Total | Sum | 72,13` e `Count | 178`
  #
  # Le due righe di coda si scartano con key_field/stop_values; il preambolo lo
  # riscrive il writer dal download, cosi' il foglio non dichiara per sempre
  # "As of 2026-08-13".
  #
  # LA COSA DA SAPERE PRIMA DI TOCCARE QUALUNQUE COSA QUI: 'Duplicates Helper'
  # legge questo foglio CELLA PER CELLA con offset fisso +13 — la sua riga 2 e'
  # `DUP_DATASET!B15`, la 1001 e' `B1014`. Quindi:
  #   - header_row 14 non e' una preferenza, e' il contratto con quel foglio;
  #   - una riga inserita nel preambolo sposterebbe TUTTI i dati di uno, senza
  #     un solo errore (c'e' un test che lo inchioda);
  #   - la capienza e' 1000 righe, e la misura `read_by_row` — vedi il campo.
  #
  # optional: true — deciso il 2026-08-19. Nessun campo ha un consumatore
  # `VBA:...`: il motore di malpractice non sa che questo foglio esiste, e la
  # catena DUP_DATASET -> Duplicates Helper -> 3 fogli DC e' isolata dal resto
  # del workbook. Se il file manca, il preflight SEGNALA, il foglio viene
  # scritto VUOTO e l'Omni Report esce comunque.
  # --------------------------------------------------------------------------
  DUP_DATASET:
    sheet: DUP_DATASET
    header_row: 14
    data_start_col: B
    # Oltre l'ultimo campo mappato non c'e' niente, ma `data_end_col` non serve a
    # dire dove si scrive: serve a dire cosa si PULISCE. La colonna C (senza
    # intestazione, ospita le etichette `Sum`/`Count`) non e' mappata da nessun
    # campo, e senza questa riga si porterebbe dietro i totali della settimana
    # prima.
    data_end_col: Q
    optional: true
    reader: table
    read_by_row: true
    key_field: "Full Name"
    stop_values: ["Total"]
    dependent_sheets:
      - "Duplicates Helper"
      - "DC Dashboard"
      - "DC Agents & Categories"
      - "DC Timing & Quality"
    fields:
      - canonical: "Full Name"
        target_col: B
        role: input
        dtype: str
        aliases: ["full_name", "Agent Name"]
        consumers: ["Duplicates Helper", "Python:coherence"]
        notes: >
          L'agente che ha lavorato il caso duplicato. E' il `key_field`: una riga
          senza questo valore non e' un record. 'Duplicates Helper'!A si difende
          gia' da solo (`IF(OR(B15="",B15="Total"),"",...)`), ma scrivere le righe
          di coda sarebbe sbagliato comunque — e il preflight dice quante ne
          scarta.
      - canonical: "Case Number"
        target_col: D
        role: input
        dtype: str
        aliases: ["case_number"]
        consumers: ["Duplicates Helper"]
        notes: >
          dtype str e non int: nell'export e' testo, e 'DC Timing & Quality'
          lo riconverte con VALUE() dove gli serve confrontarlo con il parent.
      - canonical: "Parent Case: Case Number"
        target_col: E
        role: input
        dtype: str
        aliases: ["parent_case_case_number", "Parent Case Number"]
        consumers: ["Duplicates Helper"]
        notes: >
          Il caso di cui questo e' duplicato. E' la colonna su cui si contano i
          "parent con piu' di un duplicato" e i cluster fra agenti diversi.
      - canonical: "Status"
        target_col: F
        role: input
        dtype: str
        aliases: ["status"]
        consumers: ["Duplicates Helper"]
        notes: "Closed - Duplicate Case / Closed - Spam."
      - canonical: "Case Origin"
        target_col: G
        role: input
        dtype: str
        aliases: ["case_origin"]
        consumers: ["Duplicates Helper"]
        notes: >
          Phone, Contact Us, Internal, Dataloader... NON e' la stessa colonna di
          SF_DATABASE!U ('Case Origin (group)', valori Phone/Other): qui i valori
          sono di dettaglio, e il filtro Origin di 'DC Dashboard' li elenca tutti.
      - canonical: "Date/Time Opened"
        target_col: H
        role: input
        dtype: datetime
        date_format: "%m/%d/%Y %I:%M %p"
        aliases: ["date_time_opened"]
        consumers: ["Duplicates Helper"]
        notes: >
          date_format OBBLIGATORIO, e per due motivi diversi.
          Il primo e' la solita ambiguita': `8/4/2026` si legge sia come 4 agosto
          (export americano, questo) sia come 8 aprile. Verificato che senza
          formato dichiarato `8/4/2026 3:59 PM` non e' nemmeno convertibile — la
          lista dei formati noti non copre `%I:%M %p` senza secondi — quindi qui
          l'assenza si vedrebbe subito. Ma `Date Viewpoint` insegna che
          altrove non e' cosi'.
          Il secondo: NON si puo' ripiegare su dtype str. Nell'export questa
          colonna e' testo, e il template la parsava con FIND("/"); ma Excel in
          locale italiano converte `"8/4/2026 3:59 PM"` in DATA al momento della
          scrittura, e FIND("/") su una data da' #VALUE!. Da qui la decisione D5
          del piano: si scrivono date vere, e 'Duplicates Helper'!M/N sono
          diventate `=$K2`/`=$L2`.
      - canonical: "Date/Time Closed"
        target_col: I
        role: input
        dtype: datetime
        date_format: "%m/%d/%Y %I:%M %p"
        aliases: ["date_time_closed"]
        consumers: ["Duplicates Helper", "Python:coherence"]
        notes: >
          Stesso discorso di 'Date/Time Opened'. In piu': e' la colonna su cui il
          report SF e' filtrato, quindi e' da qui che si ricava la settimana
          coperta dall'export — e il controllo di coerenza BLOCCA se non e' la
          stessa del resto del report (D6).
      - canonical: "Case Age (days)"
        target_col: J
        role: input
        dtype: float
        aliases: ["case_age_days"]
        consumers: ["Duplicates Helper"]
      - canonical: "Case Record Type"
        target_col: K
        role: input
        dtype: str
        aliases: ["case_record_type"]
        consumers: ["Duplicates Helper"]
      - canonical: "Type"
        target_col: L
        role: input
        dtype: str
        match: exact
        aliases: []
        consumers: ["Duplicates Helper"]
        notes: >
          match=exact: `Type` e' una parola cosi' corta che qualunque colonna
          nuova dell'export che normalizzi su 'type' se la prenderebbe. Meglio
          fallire il preflight che agganciare la colonna sbagliata.
      - canonical: "Primary Category"
        target_col: M
        role: input
        dtype: str
        aliases: ["primary_category"]
        consumers: ["Duplicates Helper"]
        notes: >
          Vuota in 106 righe su 178: 'Duplicates Helper'!I la rende `(blank)`
          apposta, perche' un'etichetta vuota nei raggruppamenti sparirebbe.
      - canonical: "Language: Language Name"
        target_col: N
        role: input
        dtype: str
        aliases: ["language_language_name", "Language"]
        consumers: ["Duplicates Helper"]
      - canonical: "Email"
        target_col: O
        role: input
        dtype: str
        aliases: ["email"]
        consumers: ["Duplicates Helper"]
      - canonical: "Last Modified By: Full Name"
        target_col: P
        role: input
        dtype: str
        aliases: ["last_modified_by_full_name"]
        consumers: []
        notes: >
          Nessuna formula la legge. Si mappa per fedelta' al foglio — e perche'
          una colonna dichiarata e vuota nel preflight dice piu' di una colonna
          di cui non si sa se esista.
      - canonical: "Comments/Remarks"
        target_col: Q
        role: input
        dtype: str
        aliases: ["comments_remarks"]
        consumers: []
        notes: "Come sopra. Vuota in tutte le 178 righe della W32."

  # --------------------------------------------------------------------------
  # Turni — NON viene da un CSV: da un roster WFM in forma di matrice larga
  # (un agente per riga, una colonna per giorno, la cella contiene il turno
  # "0900_1300_1330_1630"). L'adattatore `core.wfmsource.read_roster` lo porta
  # in forma lunga ed emette già queste colonne, quindi qui sono tutte `input`.
  #
  # La trasformazione è verificata contro il W30: 252 righe ricostruite = 252
  # righe nel workbook, chiavi identiche. Vedi tools/golden_turni.py.
  #
  # ATTENZIONE al filtro: `Helper Turni!A2` fa
  #   FILTER(Turni!$A, ..., Turni!$B="HPO")   -> UGUAGLIANZA ESATTA
  # quindi una skill scritta `HPO   *` esclude l'agente in silenzio. È il caso
  # misurato di Nora Ed Dahir (docs/audit-workbook-W30.md §3).
  # --------------------------------------------------------------------------
  Turni:
    sheet: Turni
    header_row: 1
    data_start_col: A
    data_end_col: I
    reader: wfm_roster
    fields:
      - canonical: "Nome agente"
        target_col: A
        role: input
        dtype: str
        consumers: ["Helper Turni", "VBA:LoadTurniStarts"]
        notes: "Name + Surname della sorgente, concatenati con uno spazio."
      - canonical: "Team/Skill"
        target_col: B
        role: input
        dtype: str
        consumers: ["Helper Turni"]
        notes: >
          FILTRO: solo `HPO` esatto entra nel report. Assente dal piano §5,
          che elencava solo A/C/D/E/F/G.
      - canonical: "Contratto"
        target_col: C
        role: input
        dtype: str
        consumers: ["Helper Turni"]
        notes: >
          NON derivabile dalla sorgente: con `Expected hours`=0600 ci sono sia
          FT (5 agenti) sia PT (2). Dato HR esterno, da config/contratti.yml.
          Nessun calcolo dipende da lui: di Helper Turni il motore legge solo
          B, N, R.
      - canonical: "Ore/gg"
        target_col: D
        role: input
        dtype: float
        consumers: ["Helper Turni"]
        notes: >
          (fine turno − inizio turno) − (fine pausa − inizio pausa), in ore,
          arrotondato a 2 decimali. Verificato su Ahmed Afifi e Viktoriia
          Lavrinets. Solo le righe LAVORA lo valorizzano: i SUMIFS di
          Helper Turni filtrano su Stato="LAVORA".
      - canonical: "Data"
        target_col: E
        role: input
        dtype: datetime
        consumers: ["Helper Turni", "VBA:LoadTurniStarts"]
        notes: "Dall'intestazione della colonna-giorno del roster."
      - canonical: "Stato"
        target_col: F
        role: input
        dtype: str
        consumers: ["Helper Turni", "VBA:LoadTurniStarts"]
        notes: >
          LAVORA se la cella contiene un turno, FERIE-OFF se contiene Off.
          La sorgente ha anche `Training` (28 celle) e `Flessibilità` (13):
          non compaiono nel W30, quindi non si sa come il processo manuale li
          tratti. La pipeline li salta e li segnala — vedi coherence.
      - canonical: "Inizio turno"
        target_col: G
        role: input
        dtype: float
        consumers: ["Helper Turni", "VBA:LoadTurniStarts"]
        notes: "Primo HHMM della cella, come frazione di giorno."
      - canonical: "Fine turno"
        target_col: H
        role: input
        dtype: float
        consumers: []
        notes: >
          Nessuna formula e nessun VBA la legge: si scrive per fedeltà al
          foglio, non perché serva.
      - canonical: "chiave"
        target_col: I
        role: input
        dtype: str
        consumers: ["Helper Turni"]
        notes: >
          Nome normalizzato con core.names.normalize_name, che replica la
          formula di `Helper Turni!P`. È la chiave di join di TUTTI i
          SUMIFS/MINIFS di Helper Turni: se non combacia, le ore previste
          diventano 0 senza errore. Valorizzata solo sulle righe LAVORA, come
          nel W30.

  # --------------------------------------------------------------------------
  # Slot Only Cases — dal foglio back-office, anch'esso una matrice larga.
  # Letto SOLO dal VBA (`LoadSlots`), nessuna formula lo tocca.
  # 259 righe ricostruite = 259 nel W30, chiavi identiche.
  # --------------------------------------------------------------------------
  Slot Only Cases:
    sheet: Slot Only Cases
    header_row: 1
    data_start_col: A
    data_end_col: E
    reader: wfm_backoffice
    fields:
      - canonical: "chiave (nome BO norm.)"
        target_col: A
        role: input
        dtype: str
        consumers: ["VBA:LoadSlots"]
        notes: >
          Nome normalizzato nello spazio di nomi del ROSTER (verificato: le 37
          chiavi del W30 coincidono con gli agenti HPO del roster, marcato
          incluso). La tabella alias di `Helper Malpractice`!D:E si usa solo per
          *raggiungere* quello spazio, non per lasciarlo — mescola due
          direzioni, vedi core/wfmsource._resolve_key.
      - canonical: "Data"
        target_col: B
        role: input
        dtype: datetime
        consumers: ["VBA:LoadSlots"]
      - canonical: "Slot inizio"
        target_col: C
        role: input
        dtype: float
        consumers: ["VBA:LoadSlots"]
      - canonical: "Slot fine"
        target_col: D
        role: input
        dtype: float
        consumers: ["VBA:LoadSlots"]
      - canonical: "Stato BO"
        target_col: E
        role: input
        dtype: str
        consumers: ["VBA:LoadSlots"]
        notes: >
          BOT quando c'è uno slot orario, NO BOT quando la sorgente dice NO BOT.
          Il W30 non contiene MAI 'NO BOT' (il processo manuale lascia vuoto),
          benché il VBA abbia un ramo `If status <> "NO BOT"`: scrivendolo
          esplicitamente quel ramo fa quello per cui è stato scritto. L'esito
          numerico non cambia. Le celle REQUEST restano vuote, come nel W30.
